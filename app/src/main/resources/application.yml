# Configuration de l'application SR-Liq. Aucun secret ici : tout passe par des variables
# d'environnement (voir .env.example à la racine du dépôt).
spring:
  application:
    name: sr-liq-bot
  datasource:
    url: ${SRLIQ_DB_URL:jdbc:postgresql://localhost:5432/srliq}
    username: ${SRLIQ_DB_USER:srliq}
    password: ${SRLIQ_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      # Sens en "long"/"short" (Direction.toString), comme en base et dans les alertes Pine.
      write-enums-using-to-string: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  # L'API n'a pas d'authentification : par défaut, on n'écoute que sur cette machine.
  # SERVER_ADDRESS=0.0.0.0 ouvre l'accès au réseau (téléphone sur le même Wi-Fi).
  address: ${SERVER_ADDRESS:127.0.0.1}
  # Le secret du webhook est dans l'URL : pas de journal d'accès Tomcat.
  tomcat:
    accesslog:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

srliq:
  webhook:
    # Secret de l'URL du webhook TradingView (>= 16 caractères). Vide : webhook désactivé (503).
    token: ${SRLIQ_WEBHOOK_TOKEN:}
  news:
    before-minutes: 30
    after-minutes: 30
  # Paper trading : rejeu déterministe du backtest du moteur sur l'historique stocké.
  paper:
    enabled: true
    default-cost: 0.3          # coût par trade, en points de prix (commission + glissement)
    costs: {}                  # par instrument, ex. { GC: 0.3, MGC: 0.3 }
    max-hold-bars: 288         # sortie forcée après N bougies du timeframe d'entrée
    capital: 100000            # capital fixe (pas de capitalisation des gains)
    risk-percent: 1.0          # risque par trade, en % du capital
  # Règles intraday du paper trading (heures UTC) ; valeurs par défaut du moteur.
  intraday:
    enabled: true
    entry-start-hour: 7
    entry-end-hour: 19
    flat-hour: 20
    flat-minute: 45
    max-trades-per-day: 3
    max-loss-per-day-r: 2.0
  # Notifications Telegram. Sans jeton ou sans discussion : désactivées. Le jeton ne doit jamais
  # être écrit ici ni journalisé.
  telegram:
    bot-token: ${SRLIQ_TELEGRAM_BOT_TOKEN:}
    chat-id: ${SRLIQ_TELEGRAM_CHAT_ID:}
    max-signal-age-minutes: 30
  # Paramètres de la stratégie (srliq.strategy.*). Chaque clé est facultative : la valeur par
  # défaut est celle du moteur (StrategyConfig.defaults(), identique à la référence Python).
  # Exemple :
  # strategy:
  #   trend-mode: structure      # structure | strict | ema | off
  #   target-mode: ob            # ob | h4 | rr
  #   stop-mode: sweep           # sweep | h4
  #   direction: both            # both | long | short
  #   sessions: [londres, overlap_londres_ny, new_york]   # vide = toutes
  #   min-rr: 1.0
  #   max-risk-htf-atr: 1.5

# Exécution réelle : AUCUN adaptateur de courtier réel n'existe. true = refus de démarrer.
trading:
  live:
    enabled: false

logging:
  level:
    # Ne pas passer le web Spring en DEBUG en production : les URL (dont le secret du webhook)
    # seraient journalisées.
    org.springframework.web: INFO
